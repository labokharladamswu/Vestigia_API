# Same URL shape as Vercel:  http://localhost:8080/api/login.php
Alias /api /var/www/app/api

<Directory /var/www/app/api>
    Options -Indexes
    AllowOverride None
    Require all granted
    # Make the Authorization header visible to PHP
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</Directory>

<FilesMatch "\.ini$">
    Require all denied
</FilesMatch>
